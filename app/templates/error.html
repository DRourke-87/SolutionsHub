{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>{% if code == 404 %}Not found{% elif code == 403 %}Not allowed{% else %}Something went wrong{% endif %}</h1>
  <p class="lead">{{ detail }}</p>
  <p><a class="btn btn-secondary" href="/">Back to dashboard</a></p>
</div>
{% endblock %}
