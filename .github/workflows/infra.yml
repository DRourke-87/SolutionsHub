name: Infrastructure (Bicep)

# Optional. Running Bicep from GitHub needs an identity Azure will accept (a service principal or OIDC
# federated credential with Contributor on the resource group). Creating that identity's role assignment
# needs Owner / User Access Administrator, so with Contributor-only access run the same two commands from
# a workstation after `az login` instead (see docs/05-deployment.md).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the deployment (false = what-if only)'
        type: boolean
        default: false
      resource_group:
        description: 'Target resource group'
        required: true
        default: 'rg-solutionshub-prod'

permissions:
  id-token: write
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: az deployment group what-if -g "${{ inputs.resource_group }}" -f infra/main.bicep -p infra/main.bicepparam
      - name: Deploy
        if: ${{ inputs.apply }}
        run: az deployment group create -g "${{ inputs.resource_group }}" -f infra/main.bicep -p infra/main.bicepparam -o table
