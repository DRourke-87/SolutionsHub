name: Deploy to Azure App Service

# Authenticates with the web app's publish profile (works with Contributor-only access; no Entra app
# registration or role assignment needed).
#   az webapp deployment list-publishing-profiles -g <rg> -n <webAppName> --xml
# Store the XML as the repository secret AZURE_WEBAPP_PUBLISH_PROFILE and set the repository variable
# AZURE_WEBAPP_NAME to the web app name (infra deployment output `webAppName`).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quick checks
        run: |
          pip install -r requirements-dev.txt
          ruff check app
          pytest -q -x
      - name: Build deployment package
        run: |
          mkdir -p dist
          zip -r dist/app.zip app alembic alembic.ini requirements.txt startup.sh -x '*/__pycache__/*' '*.pyc'
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist/app.zip
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"; then echo; exit 0; fi
            echo "waiting for app to start ($i)"; sleep 20
          done
          echo "health check did not pass"; exit 1
